name: udyoga
description: "Udyoga - career and job search: matched openings, tailored CVs, applications, contacts, career paths, learning and interview practice (Linux, Windows, Android). Part of Brahma."
publish_to: 'none'
version: 0.6.0+14

environment:
  sdk: ^3.13.5

dependencies:
  # Shared core of the Brahma apps. pubspec_overrides.yaml points it at a
  # local checkout during development.
  brahma_core:
    git:
      url: https://github.com/sudharamachandranrajeev/brahma-life-suite.git
      path: core
  # Shared motion and components (the kit), recoloured azure through a
  # KitPalette. pubspec_overrides.yaml points it at a local checkout too.
  ui_kit:
    git:
      url: https://github.com/sudharamachandranrajeev/pariksha-interview-kit.git
      path: packages/ui_kit
      ref: v0.4.0
  # The mock interviewer: voice, camera set-up cues, question plans and
  # verified-quote scoring. It brings the native speech and vision
  # libraries (sherpa_onnx, record, audioplayers, camera, LiteRT).
  interview_engine:
    git:
      url: https://github.com/sudharamachandranrajeev/pariksha-interview-kit.git
      path: packages/interview_engine
      ref: v0.4.0
  archive: ^4.0.0
  drift: ^2.35.2
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  http: ^1.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.2
  xml: ^7.0.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  desktop_webview_window: 0.3.2
  webview_flutter: ^4.14.1
  shadcn_ui: ^0.59.0
  toastification: ^3.2.2
  enough_mail: ^3.0.0
  workmanager: ^0.10.10
  html: ^0.15.7
  google_mlkit_text_recognition: ^1.0.3
  # The device checks in tool/ call sherpa_onnx directly; the app itself
  # gets it through interview_engine.
  sherpa_onnx: ^2.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  # The full ONS SOC 2020 coding index (Open Government Licence v3.0), made
  # by tool/gen_soc_index.dart and loaded once on first use.
  assets:
    - assets/soc/soc2020_index.tsv.gz
  # Inter for reading (built for screens, sharp at small sizes); Plus Jakarta
  # Sans for headings. Both SIL OFL 1.1, bundled so no font is fetched.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

# Bundle SQLite3MultipleCiphers instead of plain SQLite so the local database
# is encrypted at rest on every platform (see doc/hook.md in package:sqlite3).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
